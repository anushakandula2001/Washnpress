services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "3002:3000"

    profiles:
      - web

    env_file:
      - .env.example

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped

  postgres:
    image: postgres:15-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: washnpress
      POSTGRES_USER: washnpress
      POSTGRES_PASSWORD: washnpress

    ports:
      - "5434:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U washnpress -d washnpress" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
